<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Page AI</title>

    <style>
      body {
        width: 380px;
        padding: 16px;
        font-family: Arial, sans-serif;
      }

      button {
        width: 100%;
        padding: 10px;
        margin-top: 8px;
        cursor: pointer;
      }

      textarea {
        width: 100%;
        height: 70px;
        margin-top: 12px;
        resize: vertical;
      }

      #answer {
        margin-top: 14px;
        white-space: pre-wrap;
        line-height: 1.4;
      }
    </style>
  </head>

  <body>
    <h2>Page AI</h2>

    <button id="analyze">Analyze this page</button>

    <textarea
      id="question"
      placeholder="Ask a question about this page..."
    ></textarea>

    <button id="ask">Ask AI</button>

    <div id="answer">Ready.</div>

    <script src="popup.js"></script>
  </body>
</html>
